<?xml version="1.0" encoding="utf-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон приложения (индиго) -->
  <rect width="16" height="16" rx="3" fill="#5B5FC7"/>

  <!-- Белая страница/документ -->
  <rect x="3" y="3" width="10" height="10" rx="1" fill="#ffffff"/>

  <!-- Буква "M" — символ Markdown (отцентрована) -->
  <path d="M 5 11 L 5 4.5 L 8 8.5 L 11 4.5 L 11 11"
        stroke="#5B5FC7"
        stroke-width="1.2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Строка текста под буквой -->
  <rect x="5" y="11.7" width="6" height="0.6" rx="0.2" fill="#5B5FC7"/>
</svg>
