<?xml version="1.0" encoding="utf-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Лист документа с загнутым углом -->
  <polygon points="2.5,1.5 10.5,1.5 13.5,4.5 13.5,14.5 2.5,14.5"
           fill="#ffffff" stroke="#5B5FC7" stroke-width="1"/>

  <!-- Загнутый угол -->
  <polygon points="10.5,1.5 10.5,4.5 13.5,4.5"
           fill="#C2C4EF" stroke="#5B5FC7" stroke-width="1" stroke-linejoin="round"/>

  <!-- Буква "M" — символ Markdown -->
  <path d="M 4.5 11.5 L 4.5 6 L 8 10 L 11.5 6 L 11.5 11.5"
        stroke="#5B5FC7"
        stroke-width="1.3"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
